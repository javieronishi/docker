services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    command: --mysql-native-password=ON
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mydb
      MYSQL_USER: javier
      MYSQL_PASSWORD: 123456
    volumes:
      - mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql:
