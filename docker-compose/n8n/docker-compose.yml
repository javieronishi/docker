services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n:/home/node/.n8n
    restart: always
    # Si necesitas configurar variables de entorno: $Admin123456
    environment:
      - GENERIC_TIMEZONE=America/La_Paz
      - GENERIC_LOCALE=es

volumes:
  n8n:
